<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Secret Santa</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Mountains+of+Christmas:wght@700&family=Young+Serif&display=swap" rel="stylesheet">
<style id="css">
:root{
  --bg:#9B1D2E; --surface:rgba(255,244,234,.08); --surface-strong:#86172A; --text:#FFF4EA; --muted:#F3C6C0; --line:rgba(255,244,234,.24);
  --paper:#FFF8EF; --ink:#3A1016; --ink-muted:#7A4A50; --gold:#E9B24C; --on-gold:#2A0A0F;
  --pine:#2F7A4C; --pine-dark:#1E5434; --pine-light:#4E9A6A; --snow:#FFF7F0; --ice:#A9D3E6; --berry:#D7263D;
  color-scheme:light;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#3A0C15; --surface:rgba(247,233,226,.06); --surface-strong:#4C1420; --text:#F7E9E2; --muted:#D49A9F; --line:rgba(247,233,226,.18);
    --paper:#EFE4D6; --ink:#2E0D12; --ink-muted:#6E4A4F; --gold:#D9A441; --on-gold:#1F0609;
    --pine:#2B6B44; --pine-dark:#1A4A2E; --pine-light:#3F8459; --snow:#EDE2DC; --ice:#8DB8CC; --berry:#C42236;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#3A0C15; --surface:rgba(247,233,226,.06); --surface-strong:#4C1420; --text:#F7E9E2; --muted:#D49A9F; --line:rgba(247,233,226,.18);
  --paper:#EFE4D6; --ink:#2E0D12; --ink-muted:#6E4A4F; --gold:#D9A441; --on-gold:#1F0609;
  --pine:#2B6B44; --pine-dark:#1A4A2E; --pine-light:#3F8459; --snow:#EDE2DC; --ice:#8DB8CC; --berry:#C42236;
  color-scheme:dark;
}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px);background:var(--bg)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--text);font-family:"Figtree",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;font-size:.95rem;line-height:1.5;-webkit-font-smoothing:antialiased;overflow-x:hidden;min-height:100%;display:flex;flex-direction:column}
main{position:relative;z-index:1;flex:1 0 auto;display:flex;flex-direction:column;width:100%;max-width:28rem;margin:0 auto;padding:0 1.25rem}
.garland{display:block;flex:none;width:calc(100% + 2.5rem);max-width:none;height:auto;margin:0 -1.25rem .25rem}
.trees{display:block;flex:none;width:calc(100% + 2.5rem);max-width:none;height:auto;margin:auto -1.25rem 0;padding-top:2.5rem}
.hero{text-align:center;margin:0 0 1.25rem}
h1{font-family:"Mountains of Christmas","Young Serif",Georgia,serif;font-weight:700;font-size:2.5rem;line-height:1;margin:0 0 .45rem;letter-spacing:.01em}
h2{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:1.1rem;line-height:1.25;margin:1.75rem 0 .5rem}
p{margin:0 0 .8rem}
.lede{color:var(--muted);font-size:.92rem;max-width:32ch;margin:0 auto}
.note{color:var(--muted);font-size:.85rem}
.msg{color:var(--gold);font-weight:500;font-size:.9rem;margin:.8rem 0 0}
.ok{color:var(--gold);font-weight:500;font-size:.9rem}
button{font:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
.btn{display:flex;align-items:center;justify-content:center;width:100%;min-height:2.75rem;padding:.55rem 1.2rem;margin-top:.6rem;border-radius:999px;border:0;background:var(--gold);color:var(--on-gold);font-weight:700;font-size:.95rem}
.btn.ghost{background:transparent;color:var(--text);border:1px solid var(--line);font-weight:500}
.btn:disabled{opacity:.55;cursor:default}
.linkish{display:block;margin:1rem auto 0;padding:.4rem 0;border:0;background:none;color:var(--muted);font-size:.85rem;text-decoration:underline;text-underline-offset:3px}
input,select{font:inherit;font-size:1rem;color:var(--ink);background:var(--paper);border:0;border-radius:10px;min-height:2.6rem;padding:.45rem .8rem;width:100%;min-width:0}
.names{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.5rem;margin:0 0 1rem}
.name{display:flex;align-items:center;gap:.55rem;min-height:3rem;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--text);font-size:.98rem;font-weight:500;text-align:left;padding:.5rem .75rem}
.name:hover{border-color:var(--gold)}
.name svg{width:1.15rem;height:1.4rem;flex:none}
.center{text-align:center}
.chips{list-style:none;padding:0;margin:.5rem 0 .6rem;display:flex;flex-wrap:wrap;gap:.4rem}
.chip{display:inline-flex;align-items:center;padding:.15rem .15rem .15rem .75rem;border-radius:999px;background:var(--surface-strong);font-size:.9rem;font-weight:500}
.x{display:inline-flex;align-items:center;justify-content:center;width:2rem;height:2rem;border-radius:50%;border:0;background:transparent;color:var(--muted);font-size:1.1rem;line-height:1}
.x:hover{color:var(--text)}
.row{display:flex;gap:.5rem;align-items:center}
.row .btn{width:auto;margin:0;flex:none;min-height:2.6rem}
.excl{list-style:none;padding:0;margin:.4rem 0 .6rem;font-size:.9rem}
.excl li{display:flex;align-items:center;justify-content:space-between;gap:.5rem;padding:.2rem 0;border-bottom:1px solid var(--line)}
.excl b{font-weight:700}
.excl span{color:var(--muted)}
.addexcl{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);gap:.5rem;align-items:center}
.addexcl > span{color:var(--muted);font-size:.8rem;text-align:center}
.budget{display:flex;align-items:center;gap:.6rem}
.budget input{width:6rem}
.budget span{white-space:nowrap;color:var(--muted)}
.codes{list-style:none;padding:0;margin:.75rem 0;font-size:.92rem}
.codes li{display:grid;grid-template-columns:minmax(0,1fr) auto auto;gap:.75rem;align-items:center;padding:.5rem 0;border-bottom:1px solid var(--line)}
.code{font-family:"Young Serif",Georgia,serif;font-size:1.15rem;letter-spacing:.14em;user-select:all;-webkit-user-select:all}
.small-btn{min-height:2.25rem;padding:.25rem .8rem;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--text);font-weight:500;font-size:.82rem}
.admin{margin-top:2.25rem;padding-top:.25rem;border-top:1px dashed var(--line)}
.admin h2{margin-top:1.25rem}
.back{display:inline-block;margin:0 0 .5rem;padding:.3rem 0;border:0;background:none;color:var(--muted);font-size:.88rem}
.codein{text-align:center;font-family:"Young Serif",Georgia,serif;font-size:1.4rem;letter-spacing:.35em;text-transform:uppercase;padding-left:1.1rem}

/* Il cartellino del regalo */
.tagwrap{position:relative;display:flex;justify-content:center;padding-top:2.5rem;margin:0 0 1.25rem}
.string{position:absolute;top:0;left:50%;width:2px;height:4rem;margin-left:-1px;background:var(--gold);z-index:2}
.tag{width:min(13.5rem,70vw);height:17rem;perspective:1100px;transform:rotate(-2.5deg);transform-origin:50% 1.5rem;filter:drop-shadow(0 12px 18px rgba(0,0,0,.28))}
.inner{position:relative;width:100%;height:100%;transform-style:preserve-3d;transition:transform .95s cubic-bezier(.2,.75,.2,1)}
.tag.open .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;-webkit-backface-visibility:hidden;backface-visibility:hidden;background:var(--paper);color:var(--ink);clip-path:polygon(24% 0,76% 0,100% 15%,100% 100%,0 100%,0 15%);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:2.75rem 1rem 1.25rem}
.face::after{content:"";position:absolute;inset:.45rem;border:1.5px dashed rgba(122,74,80,.35);clip-path:polygon(24% 0,76% 0,100% 15%,100% 100%,0 100%,0 15%);pointer-events:none}
.face.back{transform:rotateY(180deg)}
.hole{position:absolute;top:1rem;left:50%;width:1rem;height:1rem;margin-left:-.5rem;border-radius:50%;background:var(--bg);box-shadow:inset 0 0 0 3px var(--gold)}
.face .small{margin:0;color:var(--ink-muted);font-size:.82rem}
.face .big{margin:.2rem 0 .4rem;font-family:"Young Serif",Georgia,serif;font-size:clamp(1.6rem,7vw,2rem);line-height:1.1;overflow-wrap:anywhere}
.face .gift{width:6rem;height:6rem;margin:.4rem 0 .5rem}
.face .holly{width:3.5rem;height:1.75rem;margin-top:.5rem}

/* neve */
.snow{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.snow i{position:absolute;top:-12px;border-radius:50%;background:var(--snow);opacity:.5;animation:fall linear infinite}
@keyframes fall{to{transform:translate3d(var(--dx,0),110vh,0)}}
@media (prefers-reduced-motion: reduce){
  .inner{transition:none}
  .snow i{animation:none}
}
</style>
</head>
<body>
<main id="root"></main>
<script type="application/json" id="state">{"v": 1, "people": ["Luca", "Alberto", "Alessandra", "Nicola", "Giorgio", "Selene", "Bea", "Federico"], "exclusions": [{"from": "Luca", "to": "Giorgio"}, {"from": "Bea", "to": "Nicola"}, {"from": "Giorgio", "to": "Selene"}, {"from": "Alberto", "to": "Bea"}, {"from": "Selene", "to": "Alberto"}, {"from": "Nicola", "to": "Luca"}], "budget": 20, "draw": {"id": "aaa7cba20546a376", "salt": "1793195defc6bc6d8d0e3a898ba9a553", "iter": 250000, "at": "2026-11-11", "entries": {"Luca": {"iv": "5DLlIUXDuna+76qb", "ct": "k2uiyT1xYbXpvzTJ/X7pGOT3Rw=="}, "Alberto": {"iv": "KwOQoWn5czNo9fCX", "ct": "5U/bXwUOcYXVgbRk2GDCRBg+zBaayg=="}, "Alessandra": {"iv": "IezciDITUVhVOOXR", "ct": "UgJNwXg/aU+9kfIrQXRzUIK2cHEJsw=="}, "Nicola": {"iv": "Zh7wHT2Djtx3pLfL", "ct": "qhKaPUW7TVrToaXwp77mpSgNDGxr/og="}, "Giorgio": {"iv": "tTado9EcWI1VuDjh", "ct": "iV/qXXWOJq9NTrYc4oksVaUdjTOC0cX3"}, "Selene": {"iv": "Wsm0yMcA4DnFPrI1", "ct": "d3FTde0U5skO6XAOQpAxz4RdFEw="}, "Bea": {"iv": "uMuKfwGkA8sKNbo9", "ct": "nyzvDzVASAvkHHKGjGfy/P9vt1xUSmlxRfE="}, "Federico": {"iv": "eYSA/hL+exdEVhk8", "ct": "sm/FFcSG8acdeZlC/aH8hUi/36D1HFQ="}}}}</script>
<script id="app">
(function(){
"use strict";
var HEAD='<meta charset="utf-8">\n<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">\n<title>Secret Santa</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>\n<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;700&family=Mountains+of+Christmas:wght@700&family=Young+Serif&display=swap" rel="stylesheet">\n';
var ITER=250000;
var ALPHA="ACDEFHJKMNPRTUVWXY34679";
var enc=new TextEncoder();

var state=JSON.parse(document.getElementById("state").textContent);
var root=document.getElementById("root");

var view=state.draw?"pick":"setup";
var who=null, revealed=null, msg="", busy=false, typed="";
var setup=freshSetup();
var pending=null;
var canEdit=false, adminOpen=false, confirmRedo=false, justPublished=false;

function freshSetup(){return {people:state.people.slice(),exclusions:state.exclusions.map(function(e){return {from:e.from,to:e.to};}),budget:state.budget};}

/* storage */
function sGet(store,k){try{return window[store].getItem(k);}catch(e){return null;}}
function sSet(store,k,v){try{window[store].setItem(k,v);return true;}catch(e){return false;}}
function sDel(store,k){try{window[store].removeItem(k);}catch(e){}}

if(sGet("sessionStorage","ss-just")){justPublished=true;adminOpen=true;sDel("sessionStorage","ss-just");}

/* dom helper */
function h(tag,attrs){
  var el=document.createElement(tag);
  if(attrs){for(var k in attrs){var v=attrs[k];if(v==null||v===false)continue;
    if(k.slice(0,2)==="on")el.addEventListener(k.slice(2),v);
    else if(k==="class")el.className=v;
    else if(k==="value")el.value=v;
    else el.setAttribute(k,v===true?"":v);}}
  for(var i=2;i<arguments.length;i++)add(el,arguments[i]);
  return el;
}
function add(el,c){if(c==null||c===false)return;if(Array.isArray(c)){c.forEach(function(x){add(el,x);});return;}el.append(c.nodeType?c:document.createTextNode(String(c)));}

/* random + crypto */
function rnd(n){var a=new Uint32Array(1);var lim=Math.floor(4294967296/n)*n;do{crypto.getRandomValues(a);}while(a[0]>=lim);return a[0]%n;}
function shuffle(arr){for(var i=arr.length-1;i>0;i--){var j=rnd(i+1);var t=arr[i];arr[i]=arr[j];arr[j]=t;}return arr;}
function randHex(n){var b=crypto.getRandomValues(new Uint8Array(n));return Array.prototype.map.call(b,function(x){return ("0"+x.toString(16)).slice(-2);}).join("");}
function b64(u8){var s="";for(var i=0;i<u8.length;i++)s+=String.fromCharCode(u8[i]);return btoa(s);}
function unb64(s){var bin=atob(s);var u=new Uint8Array(bin.length);for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u;}
function normCode(c){return String(c||"").toUpperCase().replace(/[^A-Z0-9]/g,"");}
function keyFor(code,salt,name,iter){
  return crypto.subtle.importKey("raw",enc.encode(normCode(code)),"PBKDF2",false,["deriveKey"]).then(function(base){
    return crypto.subtle.deriveKey({name:"PBKDF2",salt:enc.encode(salt+"|"+name),iterations:iter,hash:"SHA-256"},base,{name:"AES-GCM",length:256},false,["encrypt","decrypt"]);
  });
}

/* estrazione: permutazione casuale che rispetta le esclusioni */
function solve(people,excl){
  var banned={};excl.forEach(function(e){banned[e.from+"\u0000"+e.to]=1;});
  function ok(g,r){return g!==r&&!banned[g+"\u0000"+r];}
  for(var t=0;t<20000;t++){
    var perm=shuffle(people.slice());var good=true;
    for(var i=0;i<people.length;i++){if(!ok(people[i],perm[i])){good=false;break;}}
    if(good){var res={};people.forEach(function(p,i){res[p]=perm[i];});return res;}
  }
  var givers=shuffle(people.slice()),used={},out={};
  function bt(i){
    if(i===givers.length)return true;
    var g=givers[i],opts=shuffle(people.slice());
    for(var k=0;k<opts.length;k++){var r=opts[k];if(used[r]||!ok(g,r))continue;used[r]=1;out[g]=r;if(bt(i+1))return true;delete used[r];delete out[g];}
    return false;
  }
  return bt(0)?out:null;
}

function newCode(taken){var c;do{c="";for(var i=0;i<4;i++)c+=ALPHA[rnd(ALPHA.length)];}while(taken[c]);taken[c]=1;return c;}

function storedCodes(){
  if(!state.draw)return null;
  var k="ss-codes-"+state.draw.id;
  var raw=sGet("localStorage",k)||sGet("sessionStorage",k);
  try{return raw?JSON.parse(raw):null;}catch(e){return null;}
}

function inviteText(name,code,budget){
  return "🎅 Secret Santa! Ciao "+name+", il tuo codice è "+code+". Apri il link, tocca il tuo nome e inseriscilo per scoprire a chi fai il regalo. Budget: "+budget+" €.";
}

function copyText(t){
  return (navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(t).then(function(){return true;}):Promise.reject()).catch(function(){
    try{var ta=h("textarea",{style:"position:fixed;top:0;left:0;opacity:0"});ta.value=t;document.body.append(ta);ta.select();var ok=document.execCommand("copy");ta.remove();return ok;}catch(e){return false;}
  });
}

function getClaude(name){
  if(!window.claude||typeof window.claude.use!=="function")return Promise.resolve(null);
  return window.claude.use(name).catch(function(){return null;});
}

/* pubblicazione: la pagina si riscrive con l'estrazione cifrata dentro */
function buildPage(st){
  var css=document.getElementById("css").textContent;
  var app=document.getElementById("app").textContent;
  var json=JSON.stringify(st).replace(/</g,"\\u003c");
  var close="</"+"script>";
  return "<!doctype html>\n<html lang=\"it\">\n<head>\n"+HEAD+"<style id=\"css\">"+css+"</style>\n</head>\n<body>\n<main id=\"root\"></main>\n<script type=\"application/json\" id=\"state\">"+json+close+"\n<script id=\"app\">"+app+close+"\n</body>\n</html>\n";
}

/* ---------- azioni ---------- */
function doDraw(){
  msg="";
  if(setup.people.length<3){msg="Servono almeno 3 partecipanti.";render();return;}
  var pairs=solve(setup.people,setup.exclusions);
  if(!pairs){msg="Con queste esclusioni non esiste un’estrazione possibile. Togline una e riprova.";render();return;}
  busy=true;render();
  var salt=randHex(16),id=randHex(8),taken={},codes={},entries={};
  setup.people.forEach(function(p){codes[p]=newCode(taken);});
  var chain=Promise.resolve();
  setup.people.forEach(function(p){
    chain=chain.then(function(){return keyFor(codes[p],salt,p,ITER);}).then(function(key){
      var iv=crypto.getRandomValues(new Uint8Array(12));
      return crypto.subtle.encrypt({name:"AES-GCM",iv:iv},key,enc.encode(pairs[p])).then(function(ct){entries[p]={iv:b64(iv),ct:b64(new Uint8Array(ct))};});
    });
  });
  chain.then(function(){
    pairs=null;
    if(pending)sDel("localStorage","ss-codes-"+pending.state.draw.id);
    pending={codes:codes,state:{v:1,people:setup.people.slice(),exclusions:setup.exclusions.slice(),budget:setup.budget,draw:{id:id,salt:salt,iter:ITER,at:new Date().toISOString(),entries:entries}}};
    var saved=JSON.stringify(codes);
    sSet("localStorage","ss-codes-"+id,saved);sSet("sessionStorage","ss-codes-"+id,saved);
    busy=false;view="codes";render();
  }).catch(function(){busy=false;msg="Estrazione non riuscita su questo browser. Riprova da un altro.";render();});
}

function publishNow(){
  busy=true;msg="";render();
  getClaude("artifact").then(function(art){
    if(!art){busy=false;msg="Da qui non posso salvare. Apri la pagina pubblicata dal tuo account Claude e rifai l’estrazione.";render();return;}
    sSet("sessionStorage","ss-just","1");
    return art.publish(buildPage(pending.state)).catch(function(e){
      busy=false;sDel("sessionStorage","ss-just");
      var c=e&&e.code;
      if(c==="conflict")return;
      if(["not_writer","not_granted","consent_required","not_declared","capability_disabled","capability_removed"].indexOf(c)>=0)msg="Solo chi ha creato la pagina può salvare l’estrazione.";
      else if(c==="rate_limited")msg="Troppi salvataggi ravvicinati. Aspetta un minuto e riprova.";
      else msg="Salvataggio non riuscito. Riprova tra poco.";
      render();
    });
  });
}

function tryCode(code){
  var d=state.draw,e=d.entries[who];
  if(!window.crypto||!crypto.subtle)return Promise.reject({nocrypto:true});
  return Promise.resolve().then(function(){return keyFor(code,d.salt,who,d.iter).then(function(key){
    return crypto.subtle.decrypt({name:"AES-GCM",iv:unb64(e.iv)},key,unb64(e.ct));
  }).then(function(pt){return new TextDecoder().decode(pt);});});
}


/* ---------- disegni di Natale ---------- */
function svg(str){var t=document.createElement("template");t.innerHTML=str.trim();return t.content.firstChild;}
var BAUBLE_COLORS=["var(--gold)","var(--pine-light)","var(--ice)","var(--snow)"];
function bauble(cx,top,len,r,color){
  var cy=top+len+r+3;
  return '<line x1="'+cx+'" y1="'+top+'" x2="'+cx+'" y2="'+(top+len)+'" stroke="var(--gold)" stroke-width="1.2"/>'+
    '<rect x="'+(cx-3.5)+'" y="'+(top+len)+'" width="7" height="5" rx="1" fill="var(--gold)"/>'+
    '<circle cx="'+cx+'" cy="'+cy+'" r="'+r+'" fill="'+color+'"/>'+
    '<path d="M'+(cx-r+1.5)+' '+cy+' q'+(r-1.5)+' 4 '+(2*r-3)+' 0" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.5"/>'+
    '<ellipse cx="'+(cx-r*.38)+'" cy="'+(cy-r*.4)+'" rx="'+(r*.22)+'" ry="'+(r*.32)+'" fill="#fff" opacity=".6" transform="rotate(-30 '+(cx-r*.38)+' '+(cy-r*.4)+')"/>';
}
function garland(){
  var path="M-20 14 Q100 66 200 20 Q300 66 420 14";
  var b=bauble(52,36,14,10,BAUBLE_COLORS[0])+bauble(98,42,34,12,BAUBLE_COLORS[2])+bauble(146,36,10,9,BAUBLE_COLORS[1])+
        bauble(254,36,12,9,BAUBLE_COLORS[3])+bauble(302,42,30,12,BAUBLE_COLORS[0])+bauble(348,36,16,10,BAUBLE_COLORS[2]);
  var bow='<g transform="translate(200 22)"><path d="M0 0 C-14 -16 -30 -6 -22 6 C-16 13 -6 6 0 0Z" fill="var(--gold)"/><path d="M0 0 C14 -16 30 -6 22 6 C16 13 6 6 0 0Z" fill="var(--gold)"/>'+
          '<path d="M-2 2 L-12 26 L-6 23 L-3 30 Z M2 2 L12 26 L6 23 L3 30 Z" fill="var(--gold)"/><circle r="5" fill="var(--gold)" stroke="var(--on-gold)" stroke-opacity=".25"/></g>';
  return svg('<svg class="garland" viewBox="0 -12 400 124" aria-hidden="true" focusable="false">'+b+
    '<path d="'+path+'" fill="none" stroke="var(--pine)" stroke-width="16" stroke-linecap="round"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--pine-dark)" stroke-width="16" stroke-dasharray="2 5" opacity=".7"/>'+
    '<path d="'+path+'" fill="none" stroke="var(--pine-light)" stroke-width="7" stroke-dasharray="1.5 6" stroke-linecap="round"/>'+
    '<g fill="var(--gold)"><circle cx="30" cy="24" r="2.4"/><circle cx="125" cy="40" r="2.4"/><circle cx="170" cy="30" r="2.4"/><circle cx="232" cy="30" r="2.4"/><circle cx="276" cy="40" r="2.4"/><circle cx="372" cy="24" r="2.4"/></g>'+
    bow+'</svg>');
}
function tree(cx,base,ht,star){
  var w=ht*.62,out="",tiers=3;
  out+='<rect x="'+(cx-ht*.05)+'" y="'+(base-ht*.12)+'" width="'+(ht*.1)+'" height="'+(ht*.14)+'" fill="#6B3A2A"/>';
  for(var i=0;i<tiers;i++){
    var top=base-ht+i*ht*.24, bot=base-ht*.1-(tiers-1-i)*ht*.18, half=w*(.55+i*.22)/2;
    out+='<path d="M'+cx+' '+top+' L'+(cx+half)+' '+bot+' L'+(cx-half)+' '+bot+'Z" fill="var(--pine)"/>'+
         '<path d="M'+(cx-half)+' '+bot+' L'+(cx+half)+' '+bot+'" stroke="var(--snow)" stroke-width="2" stroke-linecap="round" opacity=".85"/>';
  }
  if(star)out+='<path transform="translate('+cx+' '+(base-ht-2)+') scale(.9)" d="M0 -7 L2 -2 L7 -2 L3 1.5 L4.5 7 L0 3.8 L-4.5 7 L-3 1.5 L-7 -2 L-2 -2Z" fill="var(--gold)"/>';
  return out;
}
function giftBox(x,y,w,hgt,color){
  return '<rect x="'+x+'" y="'+y+'" width="'+w+'" height="'+hgt+'" rx="1.5" fill="'+color+'"/>'+
    '<rect x="'+(x+w/2-2)+'" y="'+y+'" width="4" height="'+hgt+'" fill="var(--gold)"/>'+
    '<path d="M'+(x+w/2)+' '+y+' c-6 -7 -11 -2 -6 1 M'+(x+w/2)+' '+y+' c6 -7 11 -2 6 1" fill="none" stroke="var(--gold)" stroke-width="2.2" stroke-linecap="round"/>';
}
function trees(){
  var hill='<path d="M0 78 Q90 58 190 72 T400 64 V110 H0Z" fill="var(--snow)" opacity=".92"/>';
  var t=tree(34,80,58,true)+tree(74,80,40,false)+tree(326,72,66,true)+tree(368,72,44,false);
  var g=giftBox(176,60,22,16,"var(--pine)")+giftBox(201,64,16,12,"var(--berry)")+giftBox(219,58,18,18,"var(--ice)");
  return svg('<svg class="trees" viewBox="0 0 400 110" aria-hidden="true" focusable="false">'+hill+t+g+'</svg>');
}
function baubleIcon(i){
  var c=BAUBLE_COLORS[i%BAUBLE_COLORS.length];
  return svg('<svg viewBox="0 0 20 26" aria-hidden="true" focusable="false"><rect x="7" y="2" width="6" height="4" rx="1" fill="var(--gold)"/><circle cx="10" cy="16" r="8.5" fill="'+c+'"/><path d="M3 16 q7 4 14 0" fill="none" stroke="rgba(255,255,255,.55)" stroke-width="1.4"/><ellipse cx="6.8" cy="12.5" rx="1.8" ry="2.6" fill="#fff" opacity=".6" transform="rotate(-30 6.8 12.5)"/></svg>');
}
function giftArt(){
  return svg('<svg class="gift" viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+
    '<rect x="16" y="44" width="68" height="48" rx="3" fill="var(--pine)"/>'+
    '<rect x="11" y="32" width="78" height="15" rx="3" fill="var(--pine-light)"/>'+
    '<rect x="45" y="32" width="10" height="60" fill="var(--gold)"/>'+
    '<rect x="16" y="47" width="68" height="4" fill="var(--pine-dark)" opacity=".5"/>'+
    '<path d="M50 32 C38 12 20 18 30 30 C34 34 44 33 50 32Z" fill="var(--gold)"/><path d="M50 32 C62 12 80 18 70 30 C66 34 56 33 50 32Z" fill="var(--gold)"/>'+
    '<circle cx="50" cy="31" r="5" fill="var(--gold)" stroke="#000" stroke-opacity=".15"/>'+
    '<text x="31" y="78" text-anchor="middle" font-family="Young Serif, Georgia, serif" font-size="22" fill="var(--paper)">?</text>'+
    '<text x="69" y="78" text-anchor="middle" font-family="Young Serif, Georgia, serif" font-size="22" fill="var(--paper)">?</text></svg>');
}
function hollyArt(){
  return svg('<svg class="holly" viewBox="0 0 60 30" aria-hidden="true" focusable="false">'+
    '<path d="M30 16 C24 6 12 3 3 8 C8 10 7 14 3 17 C8 17 9 21 6 24 C15 25 24 22 30 16Z" fill="var(--pine)"/>'+
    '<path d="M30 16 C36 6 48 3 57 8 C52 10 53 14 57 17 C52 17 51 21 54 24 C45 25 36 22 30 16Z" fill="var(--pine-light)"/>'+
    '<circle cx="27" cy="14" r="3.6" fill="var(--berry)"/><circle cx="33.5" cy="13" r="3.6" fill="var(--berry)"/><circle cx="30" cy="19" r="3.6" fill="var(--berry)"/></svg>');
}
function startSnow(){
  var box=h("div",{class:"snow","aria-hidden":"true"});
  var reduce=false;try{reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;}catch(e){}
  for(var i=0;i<28;i++){
    var size=2+Math.random()*4, dur=9+Math.random()*12;
    var el=h("i",{style:"left:"+(Math.random()*100).toFixed(2)+"%;width:"+size.toFixed(1)+"px;height:"+size.toFixed(1)+"px;--dx:"+((Math.random()*60)-30).toFixed(0)+"px;animation-duration:"+dur.toFixed(1)+"s;animation-delay:-"+(Math.random()*dur).toFixed(1)+"s"+(reduce?";top:"+(Math.random()*100).toFixed(1)+"%":"")});
    box.append(el);
  }
  document.body.prepend(box);
}

/* ---------- viste ---------- */
function codesList(codes,budget,people){
  return h("ul",{class:"codes"},people.map(function(p){
    var code=codes[p];
    var btn=h("button",{class:"small-btn",onclick:function(){
      copyText(inviteText(p,code,budget)).then(function(ok){btn.textContent=ok?"Copiato":"Tieni premuto il codice";});
    }},"Copia messaggio");
    return h("li",null,h("span",null,p),h("span",{class:"code"},code||"—"),btn);
  }));
}

function viewSetup(){
  var nameIn=h("input",{type:"text",placeholder:"Nome",autocomplete:"off","aria-label":"Nuovo partecipante"});
  function addPerson(){
    var n=nameIn.value.trim();if(!n)return;
    var dup=setup.people.some(function(p){return p.toLowerCase()===n.toLowerCase();});
    if(dup){msg=n+" c’è già.";render();return;}
    setup.people.push(n);msg="";render();
  }
  nameIn.addEventListener("keydown",function(e){if(e.key==="Enter")addPerson();});

  function opts(){return setup.people.map(function(p){return h("option",{value:p},p);});}
  var fromSel=h("select",{"aria-label":"Chi pesca"},opts());
  var toSel=h("select",{"aria-label":"Chi non può pescare"},opts());
  if(setup.people.length>1)toSel.value=setup.people[1];

  var budgetIn=h("input",{type:"number",min:"1",step:"1",inputmode:"numeric",value:setup.budget,"aria-label":"Budget in euro"});
  budgetIn.addEventListener("change",function(){var v=Math.round(Number(budgetIn.value));if(v>0)setup.budget=v;else budgetIn.value=setup.budget;});

  return [
    h("header",{class:"hero"},h("h1",null,"Secret Santa"),h("p",{class:"lede"},"Controlla partecipanti, esclusioni e budget, poi fai l’estrazione. Gli abbinamenti non li vedrà nessuno.")),
    h("h2",null,"Partecipanti"),
    h("ul",{class:"chips"},setup.people.map(function(p){
      return h("li",{class:"chip"},p,h("button",{class:"x","aria-label":"Togli "+p,onclick:function(){
        setup.people=setup.people.filter(function(x){return x!==p;});
        setup.exclusions=setup.exclusions.filter(function(e){return e.from!==p&&e.to!==p;});
        render();
      }},"×"));
    })),
    h("div",{class:"row"},nameIn,h("button",{class:"btn ghost",onclick:addPerson},"Aggiungi")),
    h("h2",null,"Esclusioni"),
    setup.exclusions.length?h("ul",{class:"excl"},setup.exclusions.map(function(e,i){
      return h("li",null,h("div",null,h("b",null,e.from),h("span",null," non può pescare "),h("b",null,e.to)),
        h("button",{class:"x","aria-label":"Togli esclusione",onclick:function(){setup.exclusions.splice(i,1);render();}},"×"));
    })):h("p",{class:"note"},"Nessuna esclusione: tutti possono pescare tutti."),
    h("div",{class:"addexcl"},fromSel,h("span",null,"non può pescare"),toSel),
    h("button",{class:"btn ghost",onclick:function(){
      var f=fromSel.value,t=toSel.value;
      if(!f||!t||f===t){msg="Scegli due persone diverse.";render();return;}
      if(setup.exclusions.some(function(e){return e.from===f&&e.to===t;})){msg="Questa esclusione c’è già.";render();return;}
      setup.exclusions.push({from:f,to:t});msg="";render();
    }},"Aggiungi esclusione"),
    h("h2",null,"Budget"),
    h("label",{class:"budget"},budgetIn,h("span",null,"€ a testa")),
    msg?h("p",{class:"msg",role:"alert"},msg):null,
    h("button",{class:"btn",style:"margin-top:2rem",disabled:busy,onclick:doDraw},busy?"Estrazione in corso…":"Fai l’estrazione"),
    state.draw?h("button",{class:"btn ghost",onclick:function(){view="pick";msg="";render();}},"Annulla"):null
  ];
}

function viewCodes(){
  return [
    h("header",{class:"hero"},h("h1",null,"Ecco i codici"),h("p",{class:"lede"},"Manda a ognuno il suo codice in privato, insieme al link di questa pagina. Il pulsante copia un messaggio già pronto.")),
    codesList(pending.codes,pending.state.budget,pending.state.people),
    h("p",{class:"note"},"Dopo il salvataggio ritrovi i codici in fondo alla pagina, solo su questo dispositivo."),
    msg?h("p",{class:"msg",role:"alert"},msg):null,
    h("button",{class:"btn",disabled:busy,onclick:publishNow},busy?"Salvataggio…":"Salva l’estrazione"),
    h("button",{class:"btn ghost",disabled:busy,onclick:doDraw},"Rifai l’estrazione"),
    h("button",{class:"linkish",onclick:function(){view="setup";msg="";render();}},"Modifica partecipanti o esclusioni")
  ];
}

function adminSection(){
  var codes=storedCodes();
  if(!canEdit&&!codes)return null;
  var box=h("section",{class:"admin"},h("h2",null,"Per l’organizzatore"));
  if(justPublished)add(box,h("p",{class:"ok"},"Estrazione salvata. Ora manda a ognuno il suo codice."));
  if(!adminOpen){
    add(box,h("p",{class:"note"},"I codici sono nascosti, così nessuno li vede sbirciando il tuo schermo."));
    add(box,h("button",{class:"btn ghost",onclick:function(){adminOpen=true;render();}},"Mostra i codici"));
  }else{
    add(box,codes?codesList(codes,state.budget,state.people):h("p",{class:"note"},"I codici di questa estrazione non sono salvati su questo dispositivo. Se li hai persi, rifai l’estrazione."));
    add(box,h("button",{class:"btn ghost",onclick:function(){adminOpen=false;justPublished=false;render();}},"Nascondi i codici"));
  }
  add(box,h("button",{class:"linkish",onclick:function(){
    if(!confirmRedo){confirmRedo=true;render();return;}
    confirmRedo=false;setup=freshSetup();view="setup";msg="";render();
  }},confirmRedo?"Tocca ancora per confermare: i codici attuali non varranno più":"Rifai l’estrazione"));
  return box;
}

function viewPick(){
  return [
    h("header",{class:"hero"},h("h1",null,"Secret Santa"),h("p",{class:"lede"},"Tocca il tuo nome e inserisci il codice che ti è arrivato in privato.")),
    h("div",{class:"names"},state.people.map(function(n,i){
      return h("button",{class:"name",onclick:function(){who=n;revealed=null;msg="";typed="";confirmRedo=false;view="reveal";render();}},baubleIcon(i),h("span",null,n));
    })),
    h("p",{class:"note center"},"Budget: "+state.budget+" € a testa"),
    adminSection()
  ];
}

function viewReveal(){
  var open=!!revealed;
  var tag=h("div",{class:"tagwrap"},
    h("div",{class:"string","aria-hidden":"true"}),
    h("div",{class:"tag"+(open?" open":"")},
      h("div",{class:"inner"},
        h("div",{class:"face front","aria-hidden":open?"true":null},h("span",{class:"hole"}),h("p",{class:"small"},"Per "+who),giftArt(),h("p",{class:"small"},"Si apre con il tuo codice")),
        h("div",{class:"face back","aria-hidden":open?null:"true"},h("span",{class:"hole"}),h("p",{class:"small"},"Fai il regalo a"),h("p",{class:"big"},revealed||""),h("p",{class:"small"},"Budget "+state.budget+" €"),hollyArt())
      )
    )
  );
  var out=[h("button",{class:"back",onclick:function(){view="pick";revealed=null;msg="";render();}},open?"‹ Chiudi":"‹ Non sei "+who+"?")];
  out.push(h("h1",{class:"center"},open?"Shh!":"Ciao, "+who));
  out.push(tag);
  if(open){
    out.push(h("p",{class:"lede center",role:"status"},"Tienilo segreto fino allo scambio dei regali."));
    out.push(h("button",{class:"btn ghost",onclick:function(){view="pick";revealed=null;render();}},"Chiudi"));
    return out;
  }
  var inp=h("input",{class:"codein",type:"text",maxlength:"6",autocomplete:"off",autocapitalize:"characters",spellcheck:"false",placeholder:"····","aria-label":"Il tuo codice",value:typed});
  inp.addEventListener("input",function(){typed=inp.value;});
  var go=h("button",{class:"btn",disabled:busy},busy?"Controllo…":"Scopri a chi fai il regalo");
  function submit(){
    var c=normCode(inp.value);
    if(c.length<4){msg="Il codice ha 4 caratteri.";render();return;}
    busy=true;msg="";render();
    tryCode(c).then(function(name){busy=false;revealed=name;render();})
      .catch(function(err){busy=false;msg=(err&&err.nocrypto)?"Questa anteprima non riesce ad aprire il cartellino. Apri il file con Chrome o Safari.":"Codice non valido per "+who+". Controlla il messaggio che hai ricevuto.";render();});
  }
  go.addEventListener("click",submit);
  inp.addEventListener("keydown",function(e){if(e.key==="Enter")submit();});
  out.push(inp,msg?h("p",{class:"msg",role:"alert"},msg):null,go);
  setTimeout(function(){if(!busy)try{inp.focus({preventScroll:true});}catch(e){}},0);
  return out;
}

function render(){
  var v={setup:viewSetup,codes:viewCodes,pick:viewPick,reveal:viewReveal}[view];
  root.replaceChildren();
  add(root,garland());
  add(root,v());
  add(root,trees());
}

startSnow();
render();

getClaude("user").then(function(u){
  if(!u)return;
  return u.canEdit().then(function(ce){
    canEdit=!!ce;
    if(view==="pick")render();
  });
});
})();
</script>
</body>
</html>
